<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Admin Login</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }

    .login-container {
      width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #219150;
    }

    .error-message {
      color: red;
      margin-top: 10px;
      text-align: center;
    }

    .demo-box {
      background: #eaf4ff;
      border: 1px solid #b3d4f5;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }
    .demo-box p {
      font-size: 12px;
      font-weight: bold;
      color: #1a5fa8;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .demo-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .demo-btn {
      flex: 1;
      padding: 7px 4px;
      font-size: 12px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #1a5fa8;
      color: white;
      width: auto;
    }
    .demo-btn:hover { background: #154d8c; }
    .demo-creds {
      font-size: 10.5px;
      color: #444;
      margin-top: 8px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h2>College Admin Login</h2>

    <!-- DEMO CREDENTIALS BOX -->
    <div class="demo-box">
      <p>🔐 Demo Access — Click to Auto-Login</p>
      <div class="demo-btns">
        <button class="demo-btn" onclick="demoLogin('admin@college.com','password','admin')">Admin</button>
        <button class="demo-btn" onclick="demoLogin('demo.teacher@college.com','teacher123','teacher')">Teacher</button>
        <button class="demo-btn" onclick="demoLogin('demo.student@college.com','student123','student')">Student</button>
      </div>
      <div class="demo-creds">
        Admin: admin@college.com / password<br>
        Teacher: demo.teacher@college.com / teacher123<br>
        Student: demo.student@college.com / student123
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role">
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>
    </div>
   <button id="login-btn">Login</button>
    <div class="error-message" id="error-msg"></div>
  </div>
  <script src="login.js"></script>
</body>

</html>
